name: Build Android APK - Core Académico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          java -version
          test -f index.html || { echo "ERROR: No existe index.html"; exit 1; }
          test -f package.json || { echo "ERROR: No existe package.json"; exit 1; }

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Instalar TypeScript y Capacitor
        shell: bash
        run: |
          set -e
          npm install --save-dev typescript @capacitor/cli@^7.4.0 --no-audit --no-fund
          npm install --save @capacitor/core@^7.4.0 @capacitor/android@^7.4.0 --no-audit --no-fund

      - name: Preparar carpeta www
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          for file in main.js preload.js sw.js manifest.webmanifest; do
            if [ -f "$file" ]; then
              cp "$file" "www/$file"
            fi
          done

          for dir in icons assets img images css; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "www/"
            fi
          done

          echo "Contenido de www:"
          find www -maxdepth 5 -type f | sort

      - name: Verificar configuración de Capacitor
        shell: bash
        run: |
          set -e

          if [ -f capacitor.config.ts ]; then
            echo "Encontrado capacitor.config.ts"
            cat capacitor.config.ts
          elif [ -f capacitor.config.js ]; then
            echo "Encontrado capacitor.config.js"
            cat capacitor.config.js
          elif [ -f capacitor.config.json ]; then
            echo "Encontrado capacitor.config.json"
            cat capacitor.config.json
          else
            echo "No existe configuración de Capacitor. Creando capacitor.config.json..."

            cat > capacitor.config.json <<'EOF'
{
  "appId": "com.coreacademico.app",
  "appName": "Core Académico",
  "webDir": "www",
  "bundledWebRuntime": false
}
EOF

            cat capacitor.config.json
          fi

      - name: Comprobar Capacitor
        shell: bash
        run: |
          set -e
          npx cap --version
          npx cap doctor || true

      - name: Preparar plataforma Android
        shell: bash
        run: |
          set -e
          rm -rf android
          npx cap add android

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android

      - name: Verificar proyecto Android
        shell: bash
        run: |
          set -e
          test -f android/gradlew || {
            echo "ERROR: No se generó android/gradlew"
            exit 1
          }
          ls -la android/gradlew
          find android -maxdepth 2 -type f | sort | head -200

      - name: Preparar Gradle
        shell: bash
        run: |
          chmod +x android/gradlew

      - name: Limpiar proyecto Android
        working-directory: android
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Generar APK Debug
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar y preparar APK
        shell: bash
        run: |
          set -e

          echo "Buscando APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK."
            echo "Contenido de outputs:"
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Core-Academico.apk

          echo "APK final:"
          ls -lh release/Core-Academico.apk

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Core-Academico-APK
          path: release/Core-Academico.apk
          if-no-files-found: error
          retention-days: 30
