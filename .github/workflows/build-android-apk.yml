name: 📱 Build Android APK - Core Académico

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🟢 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 📁 Preparar archivos web para Android
        run: |
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons/* www/icons/

      - name: 🤖 Crear proyecto Android Capacitor
        run: npx cap add android

      - name: 🔄 Sincronizar aplicación
        run: npx cap sync android

      - name: 🏗️ Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Crear ZIP para el celular
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Core-Academico.apk
          printf "Core Académico - Android\n\nInstala Core-Academico.apk en tu teléfono Android.\n" > release/LEEME.txt
          cd release
          zip -r ../Core-Academico-Android.zip .

      - name: ⬆️ Subir ZIP como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Core-Academico-Android-ZIP
          path: Core-Academico-Android.zip
          if-no-files-found: error

      - name: 🚀 Publicar Release si es una etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Core-Academico-Android.zip
          generate_release_notes: true

