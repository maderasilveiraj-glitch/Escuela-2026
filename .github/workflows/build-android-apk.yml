name: Build Android APK - Core Académico

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Crear plataforma Android si no existe
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "La plataforma Android ya existe."
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Core-Academico.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Academico-APK
          path: apk-output/Core-Academico.apk
          if-no-files-found: error
