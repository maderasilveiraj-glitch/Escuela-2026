<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core Académico - Interfaz Ejecutiva 3D</title>
    <style>
        :root {
            /* Paleta Cerámica y Oro Pulido */
            --bg-ceramic: #f4f5f8;
            --panel-bg: #eceef3;
            --panel-border: #ffffff;
            
            --azul-marino: #1e293b;
            --azul-muted: #475569;
            --oro-pulido: linear-gradient(135deg, #c5a059 0%, #edd6a4 50%, #b38b46 100%);
            --oro-flat: #b38b46;
            --oro-glow: rgba(197, 160, 89, 0.2);
            --blanco-puro: #ffffff;
            
            --exito-soft: #def7ec;
            --exito-texto: #03543f;
            --exito-border: #84e1bc;
            
            /* Sombras Neomórficas 3D de alta definición */
            --shadow-3d-panel: 
                8px 8px 16px #d1d5db, 
                -8px -8px 16px #ffffff,
                inset 1px 1px 0px #ffffff;
                
            --shadow-3d-inset: 
                inset 4px 4px 8px #d1d5db, 
                inset -4px -4px 8px #ffffff;
                
            --shadow-card-materia: 
                0 6px 0px #cfd4dc, 
                4px 10px 15px rgba(165, 175, 190, 0.4);
                
            --shadow-card-active: 
                0 2px 0px #cfd4dc, 
                2px 4px 6px rgba(165, 175, 190, 0.4);
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-ceramic);
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 238, 243, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(197, 160, 89, 0.05) 0px, transparent 50%);
            padding: 30px 20px; 
            margin: 0; 
            color: var(--azul-marino);
            -webkit-tap-highlight-color: transparent;
        }

        .workspace-frame {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* --- CUADRO DE MANDO SUPERIOR (HEADER 3D) --- */
        header { 
            background: var(--panel-bg);
            padding: 26px 36px; 
            border-radius: 28px; 
            margin-bottom: 35px; 
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-3d-panel);
            position: relative;
        }
        
        .header-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            text-align: center;
        }

        @media (min-width: 768px) {
            .header-layout {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }
        }

        header h1 { 
            margin: 0; 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--azul-marino);
            text-shadow: 1px 1px 0px #ffffff;
        }

        .nav-container {
            display: flex;
            gap: 16px;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 20px;
            box-shadow: var(--shadow-3d-inset);
        }

        .btn-tab {
            background: transparent;
            color: var(--azul-muted);
            border: none;
            padding: 12px 26px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tab:hover {
            color: var(--azul-marino);
        }

        .btn-tab.active-tab {
            background: var(--blanco-puro);
            color: var(--azul-marino);
            box-shadow: 3px 3px 8px rgba(165, 175, 190, 0.4), -2px -2px 6px #ffffff;
            transform: translateY(-1px);
        }

        .metrics-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }

        .metric-item { font-size: 14px; color: var(--azul-muted); font-weight: 600; }
        .metric-item span { color: var(--oro-flat); font-weight: 800; }

        .progress-track { 
            width: 220px; height: 14px; 
            background: var(--panel-bg); 
            border-radius: 999px; overflow: hidden; 
            padding: 2px;
            box-shadow: var(--shadow-3d-inset);
            box-sizing: border-box;
        }
        
        .progress-live { 
            height: 100%; 
            background: var(--oro-pulido); 
            width: 0%; 
            border-radius: 999px;
            box-shadow: 0px 1px 3px rgba(0,0,0,0.15);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* --- PILAS CURRICULARES (KARDEX) --- */
        .view-block { display: none; }
        .view-block.active-block { display: block; animation: smoothUp 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes smoothUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .grid-kardex { 
            display: grid;
            grid-template-columns: 1fr;
            gap: 26px;
        }

        @media (min-width: 600px) { .grid-kardex { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 950px) { .grid-kardex { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1300px) { .grid-kardex { grid-template-columns: repeat(5, 1fr); } } 
        
        .column-semester { 
            background: var(--panel-bg);
            border-radius: 24px; 
            padding: 20px;
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow-3d-panel);
        }

        .column-semester.cursando-actual {
            background: #e4e7f0;
            border: 1px solid rgba(197, 160, 89, 0.4);
        }
        
        .semester-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(165, 175, 190, 0.2);
        }

        .semester-title { 
            color: var(--azul-marino); 
            font-weight: 800; 
            font-size: 13px; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-status-toggle {
            background: var(--blanco-puro);
            border: none;
            color: var(--azul-muted);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 10px;
            text-transform: uppercase;
            box-shadow: 2px 2px 5px rgba(165, 175, 190, 0.3), -1px -1px 3px #ffffff;
            transition: all 0.2s;
        }

        .btn-status-toggle:hover {
            color: var(--oro-flat);
            transform: translateY(-1px);
        }

        .column-semester.cursando-actual .btn-status-toggle {
            background: var(--oro-pulido);
            color: var(--blanco-puro);
            box-shadow: 2px 4px 8px var(--oro-glow);
        }
        
        /* --- TARJETAS BLOQUE MATE 3D --- */
        .card-materia { 
            background: var(--blanco-puro);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 16px; 
            position: relative; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 110px; 
            box-sizing: border-box; 
            cursor: pointer; 
            box-shadow: var(--shadow-card-materia);
            transform: translateY(-5px);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, background 0.2s;
        }

        .card-materia:hover { 
            transform: translateY(-7px); 
            box-shadow: 0 10px 0px #cfd4dc, 4px 14px 20px rgba(165, 175, 190, 0.5);
        }

        .card-materia:active {
            transform: translateY(-1px);
            box-shadow: var(--shadow-card-active);
        }
        
        .card-materia.en-curso {
            background: #f8fafc;
            border-left: 4px solid var(--azul-marino);
        }

        .card-materia.aprobada { 
            background: var(--exito-soft);
            border: 1px solid var(--exito-border);
            box-shadow: 0 6px 0px #b4e4cd, 4px 10px 15px rgba(132, 225, 188, 0.3);
        }
        .card-materia.aprobada:hover {
            box-shadow: 0 8px 0px #b4e4cd, 4px 14px 20px rgba(132, 225, 188, 0.4);
        }
        .card-materia.aprobada .materia-name { color: var(--exito-texto); }
        .card-materia.aprobada .materia-code { color: var(--exito-texto); opacity: 0.7; }

        .materia-code { font-size: 10px; font-weight: 700; color: var(--azul-muted); letter-spacing: 0.3px; }
        
        .materia-name { 
            font-size: 12px; 
            font-weight: 700; 
            line-height: 1.4; 
            margin: 4px 0;
            color: var(--azul-marino);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .materia-footer { display: flex; justify-content: flex-end; }
        .materia-credits { font-size: 10px; font-weight: 700; color: var(--azul-muted); }
        .card-materia.aprobada .materia-credits { color: var(--exito-texto); opacity: 0.8; }
        
        .materia-indicator {
            position: absolute;
            top: 14px; right: 14px;
            font-size: 10px;
        }
        
        /* --- PANEL DE COMPLEMENTOS Y AGENDA --- */
        .panel-workspace {
            background: var(--panel-bg);
            border-radius: 28px;
            padding: 35px;
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-3d-panel);
        }

        .row-controls {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input, button.btn-prime {
            background: var(--blanco-puro);
            border: 1px solid rgba(165, 175, 190, 0.2);
            color: var(--azul-marino);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 2px 2px 5px rgba(165, 175, 190, 0.2), inset 0 1px 1px #ffffff;
            transition: all 0.25s ease;
        }

        select:focus, input:focus {
            border-color: var(--oro-flat);
            box-shadow: 0 0 10px var(--oro-glow);
        }

        button.btn-prime {
            background: var(--oro-pulido);
            color: var(--blanco-puro);
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px var(--oro-glow), inset 0 1px 2px rgba(255,255,255,0.4);
        }

        button.btn-prime:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--oro-glow);
        }

        .scroll-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            background: var(--blanco-puro);
            border: 1px solid rgba(165, 175, 190, 0.2);
            box-shadow: var(--shadow-3d-inset);
            padding: 6px;
        }

        .table-custom {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
            text-align: center;
        }

        .table-custom th, .table-custom td {
            border: 1px solid #f1f5f9;
            padding: 8px;
            font-size: 12px;
            height: 48px;
        }

        .table-custom th {
            background: var(--panel-bg);
            color: var(--azul-marino);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            border-radius: 8px;
        }

        .table-custom td input {
            width: 95%;
            height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            color: var(--azul-marino);
            font-weight: 600;
            font-size: 12px;
            box-shadow: none;
        }

        .table-custom td input:focus {
            background: rgba(197, 160, 89, 0.08);
            border-radius: 8px;
        }

        /* BANDEJA DE ENTREGABLES EXECUTIVA */
        .section-tasks h3, .section-profesores h3 {
            color: var(--azul-marino);
            font-size: 20px;
            margin-top: 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-tasks {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 4px 4px 15px rgba(165, 175, 190, 0.2);
            border: 1px solid rgba(165, 175, 190, 0.2);
        }

        .table-tasks th, .table-tasks td {
            padding: 16px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #f1f5f9;
        }

        .table-tasks th {
            background: var(--panel-bg);
            color: var(--azul-marino);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
        }

        .table-tasks td {
            background: var(--blanco-puro);
        }

        .btn-action-delete {
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-action-delete:hover {
            background: #e11d48;
            color: white;
            border-color: #e11d48;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
        }

        /* --- PANTALLA DE APERTURA --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-ceramic); color: var(--azul-marino); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .holo-matrix-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--oro-flat);
            animation: spinCircle 2s linear infinite;
        }

        .ring-1 { width: 180px; height: 180px; border-bottom-color: var(--azul-marino); }
        .ring-2 { width: 130px; height: 130px; border-left-color: var(--oro-flat); animation-direction: reverse; animation-duration: 1.5s; }
        .ring-3 { width: 80px; height: 80px; border-right-color: var(--azul-muted); animation-duration: 1s; }

        @keyframes spinCircle { to { transform: rotate(360deg); } }

        .frase-premium-box {
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 26px 40px;
            max-width: 600px;
            width: 80%;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-3d-panel);
        }

        #loading-text { 
            font-size: 16px; 
            font-weight: 700; 
            line-height: 1.6;
            transition: opacity 0.4s ease; 
            opacity: 1;
            color: var(--azul-marino);
        }

        /* --- VENTANAS EMERGENTES (MODALES) --- */
        .universal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4); display: none; justify-content: center;
            align-items: center; z-index: 9000; backdrop-filter: blur(8px); padding: 15px; box-sizing: border-box;
        }
        .custom-modal {
            background: var(--panel-bg);
            padding: 32px; border-radius: 28px; text-align: center; max-width: 420px; width: 100%;
            border: 1px solid var(--panel-border); 
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.2), var(--shadow-3d-panel);
            transform: scale(0.9);
            animation: modalGrow 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes modalGrow { to { transform: scale(1); } }
        
        .custom-modal h2 { margin: 0 0 14px 0; color: var(--azul-marino); font-size: 22px; font-weight: 800; text-transform: uppercase;}
        .custom-modal p { color: var(--azul-muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; font-weight: 600; }
        
        .btn-modal { 
            background: var(--oro-pulido);
            color: var(--blanco-puro); border: none; padding: 14px; font-size: 13px; font-weight: 800; 
            border-radius: 14px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 12px var(--oro-glow), inset 0 1px 1px rgba(255,255,255,0.4);
            transition: transform 0.2s;
        }
        .btn-modal:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--oro-glow); }
    </style>
</head>
